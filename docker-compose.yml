version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: clinic_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/build/web:/usr/share/nginx/html/web:ro
      - ./backend/public:/usr/share/nginx/html/backend:ro
    depends_on:
      - php
    networks:
      - clinic_network
    restart: unless-stopped

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinic_php
    volumes:
      - ./backend:/var/www/html
    environment:
      - CI_ENVIRONMENT=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=clinic_db
      - DB_USER=clinic_user
      - DB_PASS=clinic_pass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - redis
    networks:
      - clinic_network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: clinic_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: clinic_db
      MYSQL_USER: clinic_user
      MYSQL_PASSWORD: clinic_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - clinic_network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: clinic_redis
    networks:
      - clinic_network
    restart: unless-stopped

networks:
  clinic_network:
    driver: bridge

volumes:
  mysql_data:
